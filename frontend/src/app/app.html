<div class="container mt-5">
  <h1 class="mb-4">Lista Prodotti</h1>

  <!-- Lista Prodotti -->
  <ul class="list-group mb-4">
    <li *ngFor="let p of prodotti$ | async" class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ p.nome }}</strong> - {{ p.descrizione }} 
        <span class="badge bg-secondary ms-2">Quantità: {{ p.quantita }}</span>
      </div>
      <button class="btn btn-danger btn-sm" (click)="eliminaProdotto(p.id)">Elimina</button>
    </li>
  </ul>

  <!-- Form Aggiunta -->
  <div class="card p-4 shadow-sm">
    <h3 class="mb-3">Aggiungi Prodotto</h3>
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Nome" [(ngModel)]="nuovoProdotto.nome" name="nome">
    </div>
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Descrizione" [(ngModel)]="nuovoProdotto.descrizione" name="descrizione">
    </div>
    <div class="mb-3">
      <input type="number" class="form-control" placeholder="Quantità" [(ngModel)]="nuovoProdotto.quantita" name="quantita">
    </div>
    <button class="btn btn-success w-100" (click)="salvaProdotto()">Aggiungi Prodotto</button>
  </div>
</div>
