<div class="container mt-5 d-flex justify-content-center">
    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
        <h3>Accedi</h3>
        <form (ngSubmit)="onLogin()">
            <div class="mb-3">
                <label for="email">Email</label>
                <input type="email" class="form-control" [(ngModel)]="loginData.email" name="email">
            </div>
            <div class="mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" [(ngModel)]="loginData.password" name="password">
            </div>
            <div class="alert alert-danger" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>
            <button type="submit" class="btn btn-primary w-100">Accedi</button>

            <p class="mt-3 text-center">
                Non hai un account? <a routerLink="/registrati" class="text-primary text-decoration-none">Registrati qui</a>
            </p>
        </form>
    </div>
</div>
