<div class="container mt-5">
  <h1 class="mb-4">Lista Prodotti</h1>

  <div class="mb-3">
    <input type="text" class="form-control" placeholder="Cerca prodotto..." [(ngModel)]="termineRicerca"
      (ngModelChange)="cercaProdotti($event)">
  </div>

  <!-- Lista Prodotti -->
  <ul class="list-group mb-4">
    <li *ngFor="let p of prodotti$ | async" class="list-group-item d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center flex-wrap gap-2">
        <span><strong>{{ p.nome }}</strong> - {{ p.descrizione }}</span>
        <span class="badge bg-secondary">Quantità: {{ p.quantita }}</span>
      </div>

      <!-- Pulsanti visibili solo agli ADMIN -->
      @if (authService.isAdmin()) {
      <div class="d-flex gap-2">
        <button class="btn btn-warning btn-sm" (click)="selezionaPerModifica(p)">Modifica</button>
        <button class="btn btn-danger btn-sm" (click)="eliminaProdotto(p.id)">Elimina</button>
      </div>
      }
    </li>
  </ul>

  <!-- Form Aggiunta/Modifica visibile solo agli ADMIN -->
  @if (authService.isAdmin()) {
  <div class="card p-4 shadow-sm">
    <h3 class="mb-3">{{ prodottoInModifica ? 'Modifica Prodotto' : 'Aggiungi Prodotto' }}</h3>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Nome" [(ngModel)]="nuovoProdotto.nome" name="nome" required>
    </div>
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Descrizione" [(ngModel)]="nuovoProdotto.descrizione"
        name="descrizione" required>
    </div>
    <div class="mb-3">
      <input type="number" class="form-control" placeholder="Quantità" [(ngModel)]="nuovoProdotto.quantita"
        name="quantita" required>
    </div>

    <!-- Pulsanti d'azione -->
    <div class="d-flex gap-2">
      <button class="btn btn-success flex-grow-1" (click)="salvaProdotto()">
        {{ prodottoInModifica ? 'Salva Modifiche' : 'Aggiungi Prodotto' }}
      </button>

      @if (prodottoInModifica) {
      <button class="btn btn-secondary" (click)="resetForm()">Annulla</button>
      }
    </div>
  </div>
  }

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show shadow" role="alert">
    <strong>Attenzione:</strong> {{ errorMessage }}
    <button type="button" class="btn-close" (click)="errorMessage = null" aria-label="Close"></button>
  </div>
